<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090e24;--card:#121a3f;--red:#d4182f;--red2:#6f0a1b;--blue:#1c4fd8;--blue2:#0a2168;--ink:#f4f6ff;--mute:#a9b3d6;--line:#ffffff1f;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 Manrope,system-ui,sans-serif}
h1,h2,h3{font-family:'Big Shoulders Display',sans-serif;font-weight:800;line-height:1.05;letter-spacing:.01em}
a{color:inherit;text-decoration:none}
header{border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--red2),var(--bg) 35%,var(--bg) 65%,var(--blue2))}
.in{max-width:1080px;margin:auto;padding:0 16px}
.brand{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 0 6px}
.brand img{height:56px;width:auto;border-radius:8px}
.sl{font:800 44px 'Big Shoulders Display';color:var(--mute);transform:skewX(-14deg)}
nav{display:flex;gap:4px;overflow-x:auto;justify-content:center}
nav a{flex:none;padding:10px 14px;color:var(--mute);font-weight:700;border-bottom:3px solid transparent}
nav a.on{color:#fff;border-image:linear-gradient(90deg,var(--red),var(--blue)) 1}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.top{padding:40px 0 24px;text-align:center}
.top h1{font-size:clamp(40px,9vw,72px)}.top p{color:var(--mute);max-width:52ch;margin:10px auto 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:0}
.lg{display:flex;gap:18px;align-items:center;padding:28px 20px}
.lg img{width:110px;height:110px;object-fit:contain;flex:none;border-radius:10px}
.lg.ID{background:linear-gradient(160deg,var(--red),var(--red2))}.lg.MY{background:linear-gradient(200deg,var(--blue),var(--blue2))}
.lg h2{font-size:34px}.lg p{font-size:14px;margin:6px 0;opacity:.9}.lg small{display:block;opacity:.8;margin-bottom:12px}
.ghost{display:inline-block;border:2px solid #fff;padding:6px 16px;font-weight:700;font-size:14px}
.ghost:hover{background:#fff;color:#090e24}
section{padding:30px 0 6px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.sh h2{font-size:32px}.sh a,.mute{color:var(--mute);font-size:14px}
.mr{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--card);border-left:6px solid var(--c);padding:14px 16px;margin-bottom:10px}
.mid{text-align:center;display:grid;font-size:13px;color:var(--mute)}.mid b{font:800 26px 'Big Shoulders Display';color:#fff}.mid em{font-style:normal;color:#fff;font-weight:700}
.tm{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}.tm.r{flex-direction:row-reverse;text-align:right}
.hx{flex:none;width:var(--s);height:var(--s);display:grid;place-items:center;font:800 calc(var(--s)*.4) 'Big Shoulders Display';color:#10152f;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.tl{flex:none;width:var(--s);height:var(--s);object-fit:contain;border-radius:50%;padding:calc(var(--s)*.08);border:2px solid #ffffff33}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.two h3{font-size:24px;padding-bottom:6px;border-bottom:3px solid var(--c);margin-bottom:4px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500;font-size:13px}
.tw{overflow-x:auto}
.pg{padding:28px 0}.pg>h1{font-size:52px}.pg>p{color:var(--mute);margin:4px 0 20px}
.lh{font-size:30px;margin:26px 0 12px;padding-left:12px;border-left:6px solid var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tc{display:flex;align-items:center;gap:14px;background:var(--card);padding:14px}
.tc b{display:block}.tc span{color:var(--mute);font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 8px}
.tab{background:var(--card);border:0;color:var(--mute);padding:8px 16px;font:700 14px Manrope;cursor:pointer}
.tab.on{background:#fff;color:#090e24}
.wk{font-size:28px;margin:22px 0 10px}
.card{background:var(--card);padding:20px;border-top:4px solid var(--c)}.card h3{font-size:26px;margin-bottom:6px}
footer{margin-top:44px;padding:26px 0 30px;background:linear-gradient(90deg,var(--red2),var(--bg) 40%,var(--bg) 60%,var(--blue2));color:var(--mute);font-size:14px}
footer .brand{justify-content:flex-start;padding:0 0 12px}footer .brand img{height:64px}
@media(max-width:760px){.split,.two{grid-template-columns:1fr}.lg img{width:84px;height:84px}.mr{padding:12px}.tm span{font-size:14px}.brand img{height:46px}nav{justify-content:flex-start}}
.vt-t{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.vt-n{background:var(--card);border-left:4px solid var(--red);padding:10px 14px;font-size:13px;color:var(--mute);margin:8px 0 14px}
.vp{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);padding:12px 14px;margin-bottom:8px;position:relative;overflow:hidden}
.vp .bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--red),var(--blue))}
.vp b{display:block}.vp span.s{color:var(--mute);font-size:13px}.vb{border:2px solid #fff;background:none;color:#fff;padding:6px 14px;font:700 13px Manrope;cursor:pointer;min-width:92px}
.vb.on{background:#fff;color:#090e24}.vc{font:800 20px 'Big Shoulders Display';margin-right:10px}.vr{display:flex;align-items:center}
.vw{display:flex;gap:6px;align-items:center;margin:6px 0 10px;flex-wrap:wrap}</style></head><body>

players(){return `<div class="pg in"><h1>Players</h1><p>Database pemain.</p>${P.length?`<div class="grid">${P.map(p=>`<div class="tc">${hx(p[2],56)}<div><b>${p[0]}</b><span>${p[1]}, ${T[p[2]].n}</span></div></div>`).join("")}</div>`:empty("Belum ada data pemain.")}</div>`},
schedule(f){f=f||"all";
 const ok=m=>f=="all"||f==m[0]||(f=="live"&&m[6]=="live")||(f=="upcoming"&&m[6]=="upcoming")||(f=="done"&&m[6]=="done");
 const ms=sorted().filter(ok),wk=[...new Set(ms.map(m=>m[1]))].sort((a,b)=>b-a);
 const tabs=[["all","Semua"],["ID","MOC ID"],["MY","MOC MY"],["live","Live"],["upcoming","Upcoming"],["done","Previous"]];
 return `<div class="pg in"><h1>Schedule</h1><div class="tabs">${tabs.map(t=>`<button class="tab ${t[0]==f?"on":""}" onclick="sched('${t[0]}')">${t[1]}</button>`).join("")}</div>${wk.length?wk.map(w=>`<h2 class="wk">Week ${w}</h2>`+ms.filter(m=>m[1]==w).map(match).join("")).join(""):empty("Belum ada pertandingan.")}</div>`},
tournament(){return `<div class="pg in"><h1>Tournament</h1><p>Daftar turnamen.</p><div class="grid">${TOUR.map(x=>`<div class="card" style="--c:${col(x.l)}"><h3>${x.t}</h3><p class="mute">${x.d}</p><p style="font-size:13px;margin-top:8px">${x.s}</p></div>`).join("")}</div></div>`},
about(){return `<div class="pg in"><h1>About Us</h1><p>Mengenal MOC: MLBB Championship.</p><div class="card" style="--c:var(--red);max-width:720px"><p>MOC: MLBB Championship adalah turnamen komunitas Mobile Legends: Bang Bang yang dimainkan penuh secara online, dengan kompetisi terpisah untuk tim Indonesia dan Malaysia. Ganti teks ini dengan profil penyelenggara, kontak, dan tautan sosial media.</p></div></div>`}
};

const FB={apiKey:"ISI_API_KEY",authDomain:"ISI.firebaseapp.com",projectId:"ISI_PROJECT_ID",appId:"ISI_APP_ID"};
const ROLES=["Gold","EXP","Mid","Jungle","Roamer"];
const VT={db:null,uid:null,votes:{},mine:{},tab:"w",wk:1,shared:false,note:"",
async init(){VT.local();VT.draw();
 try{if(window.firebase&&FB.apiKey&&FB.apiKey.indexOf("ISI_")!=0){firebase.initializeApp(FB);
  const c=await firebase.auth().signInAnonymously();VT.uid=c.user.uid;VT.fs=firebase.firestore();VT.shared=true;
  VT.fs.collection("votes").onSnapshot(sn=>{VT.votes={};sn.docs.forEach(d=>VT.votes[d.id]=d.data());VT.mine=VT.votes[VT.uid]||VT.mine;VT.draw()},()=>{VT.shared=false;VT.local();VT.draw()})}}catch(e){VT.shared=false}
},
local(){try{VT.mine=JSON.parse(localStorage.getItem("moc_vote")||"{}")}catch(e){VT.mine={}}VT.votes={me:VT.mine}},
async save(k,v){VT.mine={...VT.mine,[k]:v};VT.votes[VT.uid||"me"]=VT.mine;
 if(VT.shared){try{await VT.fs.collection("votes").doc(VT.uid).set(VT.mine);VT.note=""}catch(e){VT.note="Suara belum bisa disimpan ke server. Coba lagi sebentar."}}
 else{try{localStorage.setItem("moc_vote",JSON.stringify(VT.mine))}catch(e){}}
 VT.draw()},
cnt(k,i){return Object.values(VT.votes).filter(v=>v[k]==i).length},
card(i,k){const p=P[i],c=VT.cnt(k,i),tot=Math.max(1,Object.values(VT.votes).filter(v=>v[k]!=null).length),on=VT.mine[k]==i;
 return '<div class="vp" style="--c:'+col(T[p[2]].l)+'">'+hx(p[2],44)+'<div><b>'+p[0]+'</b><span class="s">'+p[1]+', '+T[p[2]].n+'</span></div><div class="vr"><span class="vc">'+c+'</span><button class="vb '+(on?"on":"")+'" onclick="VT.save(\''+k+'\','+(on?"null":i)+')">'+(on?"Dipilih ✓":"Vote")+'</button></div><div class="bar" style="width:'+Math.round(c/tot*100)+'%"></div></div>'},
draw(){const el=$("#vt");if(!el)return;const wks=[...new Set(M.map(m=>m[1]))].sort((a,b)=>a-b);
 const tabs=[["w","Pemain Terbaik Mingguan"],["s","Pemain Terbaik Season"],["d","Dream Team"]];
 let b="";
 if(VT.tab=="w")b='<div class="vw"><span class="mute">Pilih week:</span>'+wks.map(w=>'<button class="tab '+(w==VT.wk?"on":"")+'" onclick="VT.wk='+w+';VT.draw()">Week '+w+'</button>').join("")+'</div>'+P.map((p,i)=>VT.card(i,"w"+VT.wk)).join("");
 else if(VT.tab=="s")b=P.map((p,i)=>VT.card(i,"s")).join("");
 else b=ROLES.map(r=>'<h2 class="lh" style="--c:var(--blue)">'+r+'</h2>'+P.map((p,i)=>p[1]==r?VT.card(i,"d_"+r):"").join("")).join("");
 const n=VT.shared?"Suara dihitung bersama semua pemilih. Satu perangkat satu suara per kategori, bisa diganti kapan saja.":"Mode lokal: suara hanya tersimpan di perangkat ini. Firebase belum diisi, jadi hitungan bersama belum aktif.";
 el.innerHTML='<div class="vt-t">'+tabs.map(t=>'<button class="tab '+(t[0]==VT.tab?"on":"")+'" onclick="VT.tab=\''+t[0]+'\';VT.draw()">'+t[1]+'</button>').join("")+'</div><div class="vt-n">'+n+(VT.note?"<br><b>"+VT.note+"</b>":"")+'</div>'+b}};
pages.vote=()=>'<div class="pg in"><h1>Vote</h1><p>Pilih jagoanmu. Data pemain di sini masih demo.</p><div id="vt"></div></div>';

 $("#nav").innerHTML=nav.map(n=>`<a href="#${n[0]}" class="${n[0]==k?"on":""}">${n[1]}</a>`).join("");
 $("#app").innerHTML=pages[k]();scrollTo(0,0);if(k=="vote")VT.init()}

["l1","f1"].forEach(i=>$("#"+i).src=LOGO_ID);["l2","f2"].forEach(i=>$("#"+i).src=LOGO_MY);
